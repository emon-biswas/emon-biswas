<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="300"
     viewBox="0 0 900 300">

  <rect width="900" height="300" fill="#000000"/>

  <style>
    text {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 18px;
      fill: #00FF00;
    }
  </style>

  <!-- $ sudo apt update -->
  <text x="20" y="30">
    <tspan>$ sudo apt update</tspan>
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.1s"
      begin="0s"
      fill="freeze"/>
  </text>

  <!-- apt output -->
  <g>
    <text x="20" y="58">
      Hit:1 http://http.kali.org/kali kali-rolling InRelease
      <animate attributeName="opacity"
               from="0" to="1"
               dur="0.1s"
               begin="1.5s"
               fill="freeze"/>
    </text>

    <text x="20" y="84">
      Hit:2 http://http.kali.org/kali kali-rolling Release
      <animate attributeName="opacity"
               from="0" to="1"
               dur="0.1s"
               begin="1.7s"
               fill="freeze"/>
    </text>

    <text x="20" y="110">
      Reading package lists... Done
      <animate attributeName="opacity"
               from="0" to="1"
               dur="0.1s"
               begin="1.9s"
               fill="freeze"/>
    </text>

    <text x="20" y="136">
      Building dependency tree... Done
      <animate attributeName="opacity"
               from="0" to="1"
               dur="0.1s"
               begin="2.1s"
               fill="freeze"/>
    </text>

    <text x="20" y="162">
      Reading state information... Done
      <animate attributeName="opacity"
               from="0" to="1"
               dur="0.1s"
               begin="2.3s"
               fill="freeze"/>
    </text>
  </g>

  <!-- $ pwd -->
  <text x="20" y="205">
    $ pwd
    <animate attributeName="opacity"
             from="0" to="1"
             dur="0.1s"
             begin="3.8s"
             fill="freeze"/>
  </text>

  <!-- pwd output -->
  <text x="20" y="232">
    /home/emon/Emon-Biswas
    <animate attributeName="opacity"
             from="0" to="1"
             dur="0.1s"
             begin="4.5s"
             fill="freeze"/>
  </text>

  <!-- $ whoami -->
  <text x="20" y="270">
    $ whoami
    <animate attributeName="opacity"
             from="0" to="1"
             dur="0.1s"
             begin="5.5s"
             fill="freeze"/>
  </text>

  <!-- Secure Panda -->
  <text x="20" y="296">
    Secure Panda
    <animate attributeName="opacity"
             from="0" to="1"
             dur="0.1s"
             begin="6.3s"
             fill="freeze"/>
  </text>

</svg>
