from PIL import Image, ImageDraw, ImageFont

WIDTH = 900
HEIGHT = 330

BG = (0, 0, 0)
GREEN = (0, 255, 0)

try:
    FONT = ImageFont.truetype("C:/Windows/Fonts/consola.ttf", 18)
except:
    FONT = ImageFont.load_default()

frames = []
durations = []


def add_frame(lines, duration):
    img = Image.new("RGB", (WIDTH, HEIGHT), BG)
    draw = ImageDraw.Draw(img)

    y = 20

    for line in lines:
        draw.text(
            (20, y),
            line,
            font=FONT,
            fill=GREEN
        )
        y += 26

    frames.append(img)
    durations.append(int(duration * 1000))


# =========================
# sudo apt update
# =========================

command = "$ sudo apt update"
lines = []

for i in range(1, len(command) + 1):
    add_frame([command[:i]], 0.08)


# =========================
# APT OUTPUT
# =========================

outputs = [
    "Hit:1 http://http.kali.org/kali kali-rolling InRelease",
    "Hit:2 http://http.kali.org/kali kali-rolling Release",
    "Reading package lists... Done",
    "Building dependency tree... Done",
    "Reading state information... Done"
]

for output in outputs:
    lines.append(output)
    add_frame(lines, 0.20)


# =========================
# pwd
# =========================

lines.append("")

command = "$ pwd"
typed = ""

for char in command:
    typed += char
    add_frame(lines + [typed], 0.10)

lines.append(command)

add_frame(lines, 0.20)

lines.append("/home/emon/Emon-Biswas")

add_frame(lines, 0.60)


# =========================
# whoami
# =========================

lines.append("")

command = "$ whoami"
typed = ""

for char in command:
    typed += char
    add_frame(lines + [typed], 0.10)

lines.append(command)

add_frame(lines, 0.20)

lines.append("Emon Biswas - Penetration Tester")

add_frame(lines, 5.0)


# =========================
# CLEAR
# =========================

add_frame([], 0.20)
add_frame([], 0.20)


# =========================
# SAVE GIF
# =========================

frames[0].save(
    "terminal.gif",
    save_all=True,
    append_images=frames[1:],
    duration=durations,
    loop=0
)

print("terminal.gif created successfully!")
