<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="300"
     viewBox="0 0 900 300">

  <rect width="900" height="300" fill="#000000"/>

  <style>
    .terminal {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 18px;
      fill: #00FF00;
    }
  </style>

  <!-- $ sudo apt update -->

  <text x="20" y="30"
        class="terminal"
        opacity="0">

    $ sudo apt update

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.01s"
      begin="0s;16s"
      fill="freeze"/>
  </text>


  <!-- APT OUTPUT -->

  <g class="terminal">

    <text x="20" y="65" opacity="0">
      Hit:1 http://http.kali.org/kali kali-rolling InRelease

      <animate
        attributeName="opacity"
        values="0;1"
        dur="0.01s"
        begin="1.7s;17.7s"
        fill="freeze"/>
    </text>

    <text x="20" y="91" opacity="0">
      Hit:2 http://http.kali.org/kali kali-rolling Release

      <animate
        attributeName="opacity"
        values="0;1"
        dur="0.01s"
        begin="1.9s;17.9s"
        fill="freeze"/>
    </text>

    <text x="20" y="117" opacity="0">
      Reading package lists... Done

      <animate
        attributeName="opacity"
        values="0;1"
        dur="0.01s"
        begin="2.1s;18.1s"
        fill="freeze"/>
    </text>

    <text x="20" y="143" opacity="0">
      Building dependency tree... Done

      <animate
        attributeName="opacity"
        values="0;1"
        dur="0.01s"
        begin="2.3s;18.3s"
        fill="freeze"/>
    </text>

    <text x="20" y="169" opacity="0">
      Reading state information... Done

      <animate
        attributeName="opacity"
        values="0;1"
        dur="0.01s"
        begin="2.5s;18.5s"
        fill="freeze"/>
    </text>

  </g>


  <!-- $ whoami -->

  <text x="20" y="220"
        class="terminal"
        opacity="0">

    $ whoami

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.01s"
      begin="4s;20s"
      fill="freeze"/>
  </text>


  <!-- Identity -->

  <text x="20" y="260"
        class="terminal"
        opacity="0">

    Md Emon Biswas - Ethical Hacker - Penetration Tester - SOC Analyst

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.01s"
      begin="4.8s;20.8s"
      fill="freeze"/>
  </text>

</svg>
