from PIL import Image, ImageDraw, ImageFont

WIDTH = 900
HEIGHT = 330

BG = (0, 0, 0)
GREEN = (0, 255, 0)

try:
    FONT = ImageFont.truetype("C:/Windows/Fonts/consola.ttf", 18)
except:
    FONT = ImageFont.load_default()

frames = []
durations = []


def add_frame(lines, duration=0.08):
    img = Image.new("RGB", (WIDTH, HEIGHT), BG)
    draw = ImageDraw.Draw(img)

    y = 20

    for line in lines:
        draw.text(
            (20, y),
            line,
            font=FONT,
            fill=GREEN
        )
        y += 26

    frames.append(img)
    durations.append(int(duration * 1000))


# =========================================
# 1. sudo apt update — LETTER BY LETTER
# =========================================

command = "$ sudo apt update"

lines = []

for i in range(1, len(command) + 1):
    lines = [command[:i]]
    add_frame(lines, 0.08)


# =========================================
# 2. APT OUTPUT
# =========================================

outputs = [
    "Hit:1 http://http.kali.org/kali kali-rolling InRelease",
    "Hit:2 http://http.kali.org/kali kali-rolling Release",
    "Reading package lists... Done",
    "Building dependency tree... Done",
    "Reading state information... Done"
]

for output in outputs:
    lines.append(output)
    add_frame(lines, 0.20)


# =========================================
# 3. pwd — LETTER BY LETTER
# =========================================

lines.append("")

command = "$ pwd"
typed = ""

for char in command:
    typed += char
    add_frame(lines + [typed], 0.10)

# Keep the completed command
lines.append(command)
add_frame(lines, 0.20)


# pwd OUTPUT
lines.append("/home/emon/Emon-Biswas")
add_frame(lines, 0.60)


# =========================================
# 4. whoami — LETTER BY LETTER
# =========================================

lines.append("")

command = "$ whoami"
typed = ""

for char in command:
    typed += char
    add_frame(lines + [typed], 0.10)

# Keep the completed command
lines.append(command)
add_frame(lines, 0.20)


# =========================================
# 5. whoami OUTPUT
# =========================================

lines.append("Md Emon Biswas - Penetration Tester")
add_frame(lines, 5.0)


# =========================================
# 6. CLEAR SCREEN
# =========================================

add_frame([], 0.20)
add_frame([], 0.20)


# =========================================
# 7. SAVE GIF
# =========================================

frames[0].save(
    "terminal.gif",
    save_all=True,
    append_images=frames[1:],
    duration=durations,
    loop=0
)

print("terminal.gif created successfully!")
