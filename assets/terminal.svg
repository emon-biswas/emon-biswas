<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="300"
     viewBox="0 0 900 300">

  <rect width="900" height="300" fill="#000000"/>

  <style>
    .terminal {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 18px;
      fill: #00ff00;
    }

    .cursor {
      fill: #00ff00;
    }
  </style>

  <!-- COMMAND 1 -->
  <text x="20" y="35" class="terminal">$ sudo apt update</text>

  <clipPath id="cmd1Clip">
    <rect x="0" y="0" width="0" height="50">
      <animate attributeName="width"
               from="0"
               to="220"
               dur="1.5s"
               begin="0s;20s"
               fill="freeze"/>
    </rect>
  </clipPath>

  <text x="20" y="35"
        class="terminal"
        clip-path="url(#cmd1Clip)">
    $ sudo apt update
  </text>

  <!-- OUTPUT 1 -->
  <g class="terminal">
    <text x="20" y="65">
      <animate attributeName="opacity"
               values="0;1"
               dur="0.1s"
               begin="1.6s;21.6s"
               fill="freeze"/>
      Hit:1 http://http.kali.org/kali kali-rolling InRelease
    </text>

    <text x="20" y="90">
      <animate attributeName="opacity"
               values="0;1"
               dur="0.1s"
               begin="1.8s;21.8s"
               fill="freeze"/>
      Hit:2 http://http.kali.org/kali kali-rolling Release
    </text>

    <text x="20" y="115">
      <animate attributeName="opacity"
               values="0;1"
               dur="0.1s"
               begin="2s;22s"
               fill="freeze"/>
      Reading package lists... Done
    </text>

    <text x="20" y="140">
      <animate attributeName="opacity"
               values="0;1"
               dur="0.1s"
               begin="2.2s;22.2s"
               fill="freeze"/>
      Building dependency tree... Done
    </text>

    <text x="20" y="165">
      <animate attributeName="opacity"
               values="0;1"
               dur="0.1s"
               begin="2.4s;22.4s"
               fill="freeze"/>
      Reading state information... Done
    </text>
  </g>

  <!-- COMMAND 2 -->
  <clipPath id="cmd2Clip">
    <rect x="0" y="0" width="0" height="50">
      <animate attributeName="width"
               from="0"
               to="70"
               dur="0.5s"
               begin="4s;24s"
               fill="freeze"/>
    </rect>
  </clipPath>

  <text x="20" y="200"
        class="terminal"
        clip-path="url(#cmd2Clip)">
    $ pwd
  </text>

  <!-- OUTPUT 2 -->
  <text x="20" y="225" class="terminal">
    <animate attributeName="opacity"
             values="0;1"
             dur="0.1s"
             begin="4.6s;24.6s"
             fill="freeze"/>
    /home/emon/Emon-Biswas
  </text>

  <!-- COMMAND 3 -->
  <clipPath id="cmd3Clip">
    <rect x="0" y="0" width="0" height="50">
      <animate attributeName="width"
               from="0"
               to="110"
               dur="0.7s"
               begin="6s;26s"
               fill="freeze"/>
    </rect>
  </clipPath>

  <text x="20" y="260"
        class="terminal"
        clip-path="url(#cmd3Clip)">
    $ whoami
  </text>

  <!-- OUTPUT 3 -->
  <text x="160" y="260" class="terminal">
    <animate attributeName="opacity"
             values="0;1"
             dur="0.1s"
             begin="6.8s;26.8s"
             fill="freeze"/>
    Secure Panda
  </text>

</svg>
